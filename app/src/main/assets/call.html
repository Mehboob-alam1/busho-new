<!DOCTYPE html>
<html>
<head>
    <link href="./style.css" rel="stylesheet" />
    <style>
        body {
            margin: 0;
            padding: 0;
            background: black;
            overflow: hidden;
        }

        video {
            position: absolute;
            object-fit: cover;
        }

        .primary-video {
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .secondary-video {
            width: 120px;
            height: 160px;
            bottom: 16px;
            right: 16px;
            z-index: 2;
            border-radius: 8px;
            border: 2px solid white;
        }

        .full {
            width: 100% !important;
            height: 100% !important;
            top: 0 !important;
            left: 0 !important;
            bottom: 0 !important;
            right: 0 !important;
            border-radius: 0 !important;
        }
    </style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.3.2/peerjs.js"></script>

<video class="secondary-video" autoplay id="remote-video"></video>
<video class="primary-video" autoplay muted id="local-video"></video>

<script src="./call.js"></script>

<script>
    let isSwapped = false;
    function swapVideos() {
        const remoteVideo = document.getElementById('remote-video');
        const localVideo = document.getElementById('local-video');

        if (!isSwapped) {
            remoteVideo.classList.add('primary-video');
            remoteVideo.classList.remove('secondary-video');

            localVideo.classList.add('secondary-video');
            localVideo.classList.remove('primary-video');
        } else {
            remoteVideo.classList.add('secondary-video');
            remoteVideo.classList.remove('primary-video');

            localVideo.classList.add('primary-video');
            localVideo.classList.remove('secondary-video');
        }
        isSwapped = !isSwapped;
    }
</script>
</body>
</html>
