<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="./style.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; background: black; overflow: hidden; }
        video { position: absolute; object-fit: cover; }
        .primary-video { width: 100%; height: 100%; top: 0; left: 0; z-index: 1; }
        .secondary-video {
            width: 120px; height: 160px; bottom: 16px; right: 16px; z-index: 2;
            border-radius: 8px; border: 2px solid white;
        }
    </style>
</head>
<body>
<script src="file:///android_asset/peerjs.js"></script>
<video class="secondary-video" autoplay playsinline id="local-video"></video>
<video class="primary-video" autoplay playsinline id="remote-video"></video>
<script src="file:///android_asset/call.js"></script>
</body>
</html>
